# === RGB underglow (11 x WS2812 on the Reviung41 PCB) ===
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# Cap the real LED output at 30 %. The WS2812B LEDs run on 3.3 V (below their
# 3.5 V spec) and misbehave at high brightness; see docs/led-investigation.md.
# BRI+/BRI- still step 0-100, but 100 now means 30 % actual output.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=30
# Start value must be <= BRT_MAX; 30 -> about 9 % actual output
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
# RGB policy is handled by the rgb_battery_guard module in this repo (src/):
#   battery -> RGB off + LED power cut (RGB TOG ignored)
#   USB     -> manual, RGB TOG switches it; previous choice restored on plug-in
# The built-in AUTO_OFF_USB / AUTO_OFF_IDLE options are left off on purpose:
# in ZMK v0.3 they share one state and can re-enable RGB on battery.
CONFIG_ZMK_RGB_BATTERY_GUARD=y

# === Power management ===
# Idle after 30 s without a keypress
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Deep sleep after 15 min; any key wakes it (first keypress is used only to wake)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# === Prospector status advertisement ===
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Reviung41"

# === nRF52840 regulators (verified 2026-10-18 with pwrdiag: board runs in
# high-voltage mode via VDDH, both DC/DC inductors fitted, stable on BLE+battery) ===
# REG1 (VDD -> core 1.3 V) DC/DC: ZMK v0.3 default for nice_nano_v2, stated explicitly
CONFIG_BOARD_ENABLE_DCDC=y
# REG0 (VDDH -> VDD 3.3 V) DC/DC: off by default in v0.3, enabled here
CONFIG_BOARD_ENABLE_DCDC_HV=y
